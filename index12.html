<!-- Forms -->
<!DOCTYPE html>
<html>  
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My first website</title>
    </head>
    <body>

        <form action="index.php" method="POST" enctype="multipart/form-data">
            <!-- or method="GET"-->

            <label for="username">Username:</label>
            <input type="text" id="Username" placeholder="nigga" minlength="6" maxlength="15" required><br>

            <label for="password">Password:</label>
            <input type="password" id="password"><br>

            <label for="email">email:</label>
            <input type="email" id="email" placeholder="Enter your email"><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><br>

            <label for="bday">Birthday:</label>
            <input type="date" id="bday"><br>

            <label for="quantity">quantity:</label>
            <input type="number" id="quantity" placeholder="Enter quantity" min="1" max="100" value="1"><br>

            <label for="title">Title:</label>

            <label for="Mr.">Mr.</label>
            <input type="radio" id="Mr." value="Mr." name="title">
            <label for="Mrs.">Mrs.</label>
            <input type="radio" id="Mrs." value="Mrs." name="title">
            <label for="Phd.">Phd</label>
            <input type="radio" id="Phd." value="Phd." name="title"><br>

            <label for="payment">payment</label>
            <select id="payment">
                <option value="visa">visa</option>
                <option value="paypal">paypal</option>
                <option value="mastercard">mastercard</option>
            </select><br>

            <label for="subscribe">subscribe</label>
            <input type="checkbox" id="subscribe"><br>

            <label for="comment">comment:</label>
            <textarea id="comment" rows="3" cols="25"></textarea><br>

            <label for="file">file:</label>
            <input type="file" id="file" accept="image/png,image/jpeg"><br>

            <input type="reset">
            <input type="submit">

        </form>

    </body>
</html>
